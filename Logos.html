<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logos | Tristan Asis</title>
  <link rel="stylesheet" href="port.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">Tristan <span>Asis</span></a>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
    <span></span><span></span><span></span>
  </button>
  <nav class="navbar" id="navbar">
    <a href="index.html">Home</a>
    <a href="index.html#education">Education</a>
    <div class="dropdown">
      <a href="project.html" class="drop-trigger active">Projects ▾</a>
      <div class="dropdown-menu">
        <a href="websites.html">WEB</a>
        <a href="Logos.html">LOGOS</a>
      </div>
    </div>
    <div class="dropdown">
      <a href="#" class="drop-trigger">Subjects ▾</a>
      <div class="dropdown-menu">
        <a href="as101.html">AS101</a>
        <a href="as102.html">AS102</a>
      </div>
    </div>
    <a href="certificates.html">Certificates</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>

<section class="as102">
  <h2 class="heading"><span>LOGOS</span></h2>
  <div class="galleryy">
    <div class="galleryy-item"><img src="Project-images/3logo.jpg" alt="3S Logo"></div>
    <div class="galleryy-item"><img src="Project-images/3slogo.png" alt="3S Logo Alt"></div>
    <div class="galleryy-item"><img src="Project-images/ali.png" alt="Ali Logo"></div>
    <div class="galleryy-item"><img src="Project-images/alilogo2.jpg" alt="Ali Logo 2"></div>
  </div>
</section>

<script>
  const menuToggle = document.getElementById("menuToggle");
  const navbar     = document.getElementById("navbar");
  menuToggle.addEventListener("click", function(e){
    e.stopPropagation();
    this.classList.toggle("active");
    navbar.classList.toggle("open");
  });
  navbar.querySelectorAll("a:not(.drop-trigger)").forEach(link => {
    link.addEventListener("click", () => {
      menuToggle.classList.remove("active");
      navbar.classList.remove("open");
      document.querySelectorAll(".dropdown").forEach(d => d.classList.remove("open"));
    });
  });
  document.addEventListener("click", function(e){
    if(!navbar.contains(e.target) && !menuToggle.contains(e.target)){
      menuToggle.classList.remove("active");
      navbar.classList.remove("open");
      document.querySelectorAll(".dropdown").forEach(d => d.classList.remove("open"));
    }
  });
  document.querySelectorAll(".drop-trigger").forEach(trigger => {
    trigger.addEventListener("click", function(e){
      if(window.innerWidth <= 768){
        e.preventDefault();
        const parent = this.closest(".dropdown");
        const isOpen = parent.classList.contains("open");
        document.querySelectorAll(".dropdown").forEach(d => d.classList.remove("open"));
        if(!isOpen) parent.classList.add("open");
      }
    });
  });
</script>
</body>
</html>
